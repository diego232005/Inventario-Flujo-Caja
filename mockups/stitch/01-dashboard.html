<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Inventario y Flujo de Caja</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0F172A;--surface:#1E293B;--surface-2:#334155;--text:#F8FAFC;--muted:#94A3B8;--accent:#0EA5E9;--ok:#14B8A6;--warn:#F59E0B;--danger:#EF4444;--border:#475569}
    *{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
    aside{width:220px;background:#0B1224;border-right:1px solid var(--border);padding:24px 16px}
    aside h1{font-family:"Source Serif 4",serif;font-size:1.15rem;margin:0 0 24px;color:var(--accent)}
    nav a{display:block;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:6px;margin-bottom:4px}
    nav a.active,nav a:hover{background:var(--surface);color:var(--text)}
    main{flex:1;padding:24px}
    h2{font-family:"Source Serif 4",serif;margin:0 0 8px}
    .sub{color:var(--muted);margin-bottom:24px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    .kpi{background:var(--surface);padding:16px;border-bottom:3px solid var(--accent)}
    .kpi.warn{border-color:var(--warn)}.kpi.danger{border-color:var(--danger)}.kpi.ok{border-color:var(--ok)}
    .kpi span{display:block;color:var(--muted);font-size:.85rem}
    .kpi strong{font-size:1.4rem;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <aside>
    <h1>Almacén IT</h1>
    <nav>
      <a class="active" href="01-dashboard.html">Dashboard</a>
      <a href="02-inventario.html">Inventario</a>
      <a href="03-proveedores.html">Proveedores</a>
      <a href="04-ordenes-sugeridas.html">Órdenes sugeridas</a>
    </nav>
  </aside>
  <main>
    <h2>Cierre mensual</h2>
    <p class="sub">Resumen ejecutivo · período demo</p>
    <div class="kpis">
      <div class="kpi"><span>Capital inmovilizado</span><strong>$48.2M</strong></div>
      <div class="kpi ok"><span>Flujo neto</span><strong>$16.1M</strong></div>
      <div class="kpi danger"><span>Productos críticos</span><strong>7</strong></div>
      <div class="kpi warn"><span>&gt;90 días</span><strong>6</strong></div>
      <div class="kpi"><span>Capacidad de reorden</span><strong>$9.4M</strong></div>
      <div class="kpi"><span>Costo OC sugeridas</span><strong>$6.7M</strong></div>
    </div>
  </main>
</body>
</html>
